name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]   # PowerShell 7 and Windows PowerShell 5.1
    steps:
      - uses: actions/checkout@v5
      - name: Install jq if missing
        shell: pwsh
        run: if (-not (Get-Command jq -ErrorAction SilentlyContinue)) { choco install jq -y --no-progress }
      # (a step's shell: cannot take ${{ matrix.* }}, hence one step per shell)
      - name: Run tests in PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/run-tests.ps1
      - name: Run tests in Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/run-tests.ps1
