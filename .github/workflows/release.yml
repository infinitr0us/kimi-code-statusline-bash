name: release

# Push a tag like v0.1.0 (with a matching CHANGELOG.md section) to test, build and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build assets
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/build-release.ps1 $env:TAG
      - name: Publish the release
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem dist -File | Where-Object Name -ne 'NOTES.md').FullName
          $extra = if ($env:TAG.Contains('-')) { @('--prerelease') } else { @() }
          gh release create $env:TAG @assets --title $env:TAG --notes-file dist/NOTES.md --verify-tag @extra
